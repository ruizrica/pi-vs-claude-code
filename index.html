<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #2d3748;
        }

        p {
            font-size: 1.1rem;
            color: #718096;
            line-height: 1.6;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="emoji">👋</div>
        <h1>Hello, World!</h1>
        <p>Welcome to my simple HTML5 page. Clean, minimal, and ready to go.</p>
    </main>
</body>
</html>
